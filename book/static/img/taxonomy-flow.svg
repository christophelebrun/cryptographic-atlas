<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Cryptographic Atlas taxonomy flow</title>
  <desc id="desc">A layered diagram from security goals and assumptions through primitives, proof systems, protocols, systems, and design patterns.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2f4a4f" />
    </marker>
    <style>
      .box { fill: #f8fbfb; stroke: #9fb3b6; stroke-width: 2; rx: 8; }
      .goal { fill: #ecfdf5; }
      .assumption { fill: #eff6ff; }
      .advanced { fill: #fff7ed; }
      .system { fill: #f8fafc; }
      .label { font: 600 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #152024; }
      .small { font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526166; }
      .line { stroke: #2f4a4f; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="520" fill="#ffffff" />
  <text x="48" y="44" class="label">Taxonomy flow</text>
  <text x="48" y="68" class="small">Separate goals, assumptions, building blocks, protocols, systems, and patterns before composing them.</text>
  <rect x="48" y="104" width="250" height="74" class="box goal" />
  <text x="70" y="134" class="label">Security goals</text>
  <text x="70" y="158" class="small">Confidentiality, integrity, anonymity</text>
  <rect x="48" y="224" width="250" height="74" class="box assumption" />
  <text x="70" y="254" class="label">Assumptions</text>
  <text x="70" y="278" class="small">Discrete log, RSA, lattices, setup</text>
  <rect x="356" y="104" width="250" height="74" class="box" />
  <text x="378" y="134" class="label">Basic primitives</text>
  <text x="378" y="158" class="small">Hash, MAC, signatures, encryption</text>
  <rect x="356" y="224" width="250" height="74" class="box advanced" />
  <text x="378" y="254" class="label">Structured primitives</text>
  <text x="378" y="278" class="small">FHE, threshold, accumulators, VDFs</text>
  <rect x="356" y="344" width="250" height="74" class="box advanced" />
  <text x="378" y="374" class="label">Proof systems</text>
  <text x="378" y="398" class="small">ZKPs, SNARKs, range proofs</text>
  <rect x="664" y="164" width="250" height="74" class="box system" />
  <text x="686" y="194" class="label">Protocols</text>
  <text x="686" y="218" class="small">MPC, mixnets, credentials</text>
  <rect x="664" y="284" width="250" height="74" class="box system" />
  <text x="686" y="314" class="label">Systems</text>
  <text x="686" y="338" class="small">Voting, private claims, rollups</text>
  <rect x="664" y="404" width="250" height="74" class="box system" />
  <text x="686" y="434" class="label">Design patterns</text>
  <text x="686" y="458" class="small">Commit-reveal, nullifiers, aggregation</text>
  <path d="M298 141 H356" class="line" />
  <path d="M298 261 H356" class="line" />
  <path d="M606 141 C632 145 640 174 664 194" class="line" />
  <path d="M606 261 C632 260 640 224 664 207" class="line" />
  <path d="M606 381 C640 364 646 336 664 321" class="line" />
  <path d="M789 238 V284" class="line" />
  <path d="M789 358 V404" class="line" />
</svg>
