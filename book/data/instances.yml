instances:
  - id: sha-256
    name: SHA-256
    kind: algorithm
    instance_of:
      - hash-function
    taxonomy_level: basic-primitive
    maturity: deployed
    post_quantum_posture: plausible
    requires_trusted_setup: false
    assumptions:
      - SHA-2 collision resistance and preimage resistance remain adequate for the use case.
      - Output length and domain separation match the security goal.
    common_uses:
      - Hashing public data.
      - Commitment preimages with sufficient entropy.
      - Transcript hashing and identifier derivation.
    cautions:
      - Do not use a bare hash as a message authentication code.
      - Do not treat hash commitments to low-entropy values as hiding without salt or randomness.
    references:
      - nist-fips-180-4
