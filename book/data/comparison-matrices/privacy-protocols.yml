id: privacy-protocols
title: Privacy protocol comparison
description: Comparison of common privacy protocols and their metadata boundaries.
columns:
  - main_privacy_goal
  - confidence_model
  - metadata_leaks
  - common_failure
  - maturity
rows:
  - concept: Anonymous credentials
    values:
      main_privacy_goal: selective disclosure or unlinkable authorization
      confidence_model: trusted issuer plus holder secret
      metadata_leaks: issuer-verifier collusion, rare attributes, revocation checks
      common_failure: revocation or verifier context tracks users
      maturity: emerging
  - concept: Anonymous tokens
    values:
      main_privacy_goal: unlink issuance and redemption of authorization tokens
      confidence_model: issuer policy plus blind signature, OPRF, or accumulator assumptions
      metadata_leaks: issuance timing, redemption timing, transport identifiers
      common_failure: token privacy defeated by browser, network, or verifier logs
      maturity: emerging
  - concept: Blind-signature credentials
    values:
      main_privacy_goal: authorize a credential without showing the issuer the eventual presentation token
      confidence_model: trusted issuer plus blind-signature unforgeability and holder-secret policy
      metadata_leaks: issuance metadata, presentation timing, revocation checks
      common_failure: blind issuance treated as full anonymous credentials
      maturity: emerging
  - concept: Nullifiers
    values:
      main_privacy_goal: one anonymous action per context
      confidence_model: holder secret plus public duplicate registry
      metadata_leaks: timing, transaction fees, reused contexts
      common_failure: nullifier accepted without eligibility proof
      maturity: emerging
  - concept: OPRFs
    values:
      main_privacy_goal: client learns keyed PRF output without revealing input
      confidence_model: mathematical assumption plus server-key secrecy
      metadata_leaks: request timing, server identity, request volume
      common_failure: missing domain separation or invalid group-element handling
      maturity: emerging
  - concept: Private set intersection
    values:
      main_privacy_goal: reveal only set overlap, cardinality, or approved function
      confidence_model: depends on semi-honest, malicious, or helper-server model
      metadata_leaks: set size, output, timing, abort behavior
      common_failure: repeated queries, low-entropy elements, or wrong adversary model
      maturity: mature
  - concept: Secure aggregation
    values:
      main_privacy_goal: aggregate-only disclosure
      confidence_model: honest-majority or non-collusion depending on protocol
      metadata_leaks: participation, dropout, cohort size
      common_failure: small cohorts or repeated queries reveal individuals
      maturity: mature
  - concept: MPC
    values:
      main_privacy_goal: joint computation without revealing inputs
      confidence_model: adversary threshold and abort model
      metadata_leaks: participant set, circuit shape, aborts
      common_failure: output or abort pattern leaks inputs
      maturity: mature
  - concept: Mixnets
    values:
      main_privacy_goal: sender-recipient unlinkability through shuffling
      confidence_model: at least one honest mix
      metadata_leaks: timing, batch membership, message size
      common_failure: small batches or all mixes collude
      maturity: mature
  - concept: Secure messaging
    values:
      main_privacy_goal: message-content confidentiality with forward secrecy and participant authentication
      confidence_model: endpoint secrets, ratchet state, key directories, and server-delivery assumptions
      metadata_leaks: contact graph, device list, timing, IP addresses
      common_failure: endpoint compromise or plaintext backups defeat protocol guarantees
      maturity: deployed
