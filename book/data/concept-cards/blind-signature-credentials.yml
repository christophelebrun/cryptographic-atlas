id: blind-signature-credentials
name: Blind-Signature Credentials
category: Protocols
level: protocol
short_intuition: Blind issuance can authorize credentials without exposing the exact token being signed.
security_goals:
  - blind issuance
  - credential authenticity
assumptions:
  - issuer is trusted for claims
  - holder secret remains protected
requires_trusted_setup: false
post_quantum: depends
post_quantum_posture: depends
confidence_model:
  type: trusted-issuer
  threshold: null
  breaks_if:
    - revocation checks track holders
    - issuer over-issues credentials
  setup:
    - issuer signing key
typical_uses:
  - anonymous authorization
  - identity wallets
does_not_provide:
  - revocation privacy by default
  - non-transferability by default
composition_risks:
  - rare-attribute linkage
  - metadata linking issuance to presentation
metadata_leaks:
  - presentation timing
  - verifier identity
implementation_risk: high
auditability: requires-expert-review
parameter_sensitivity: scheme-dependent
revocation_story: Requires privacy-preserving revocation or status mechanisms.
operational_failure_modes:
  - over-disclosure
  - status-check tracking
maturity: emerging
related:
  - blind-signatures
  - privacy-preserving-revocation
references:
  - chaum-blind-signatures
  - rfc9474-rsa-blind-signatures
  - w3c-vc-data-model-2
