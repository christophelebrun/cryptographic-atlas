id: password-hashing
name: Password Hashing
category: Basic primitives
level: basic-primitive
short_intuition: Salted and expensive verifiers slow offline guessing after password-database theft.
security_goals:
  - offline guessing resistance
  - verifier storage hardening
assumptions:
  - password has enough entropy for the threat model
  - parameters match current hardware
requires_trusted_setup: false
post_quantum: true
post_quantum_posture: plausible
confidence_model:
  type: client-side-secret
  threshold: null
  breaks_if:
    - passwords are weak
    - online guessing is unlimited
  setup:
    - salt and parameter policy
typical_uses:
  - login verifier storage
  - password-derived local encryption
does_not_provide:
  - PAKE
  - account recovery security
composition_risks:
  - weak reset flows
  - parameters never upgraded
metadata_leaks:
  - account existence
  - login timing
implementation_risk: medium
auditability: requires-operational-audit
parameter_sensitivity: high
revocation_story: Password reset invalidates old verifiers; breached databases need forced rotation.
operational_failure_modes:
  - unsalted fast hashes
  - password logging
maturity: deployed
related:
  - key-derivation-functions
  - password-authenticated-key-exchange
references:
  - rfc9106-argon2
  - owasp-password-storage
