id: deniability
name: Deniability
category: Security goals
level: security-goal
short_intuition: A transcript should not become convincing evidence to outsiders that a participant said or did something.
security_goals:
  - deniability
assumptions:
  - authentication is local rather than publicly transferable
  - transcripts and logs do not add independent evidence
requires_trusted_setup: not-applicable
post_quantum: not-applicable
post_quantum_posture: not-applicable
confidence_model:
  type: client-side-secret and mixed
  threshold: null
  breaks_if:
    - messages are digitally signed for public verification
    - server or client logs create durable receipts
  setup:
    - session keys
    - transcript handling policy
typical_uses:
  - secure messaging
  - off-the-record negotiation
  - coercion-resistant workflows
does_not_provide:
  - anonymity
  - protection from screenshots
  - public proof of message authorship
composition_risks:
  - adding non-repudiating signatures
  - retaining plaintext backups
  - assuming key evolution alone establishes deniability
metadata_leaks:
  - contact graph
  - delivery timing
  - device logs
implementation_risk: not-applicable
auditability: not-applicable
parameter_sensitivity: not-applicable
revocation_story: Not applicable to the goal; concrete messaging keys and devices need rotation and compromise recovery.
operational_failure_modes:
  - publicly verifiable signatures on message content
  - independent device or server evidence outside the transcript model
maturity: not-applicable
related:
  - forward-secrecy
  - secure-messaging
  - non-repudiation
references:
  - borisov-goldberg-brewer-otr
  - di-raimondo-deniable-authentication
  - benaloh-tuinstra-receipt-free
  - nist-pqc-project
