id: password-authenticated-key-exchange
name: Password-Authenticated Key Exchange
category: Protocols
level: protocol
short_intuition: PAKE derives a strong session key from a password without exposing transcripts to offline guessing.
security_goals:
  - password authentication
  - session key establishment
  - offline guessing resistance
assumptions:
  - PAKE construction is implemented as specified
  - identities and parameters are transcript-bound
  - online guessing is rate limited
requires_trusted_setup: false
post_quantum: depends
post_quantum_posture: depends
confidence_model:
  type: mixed
  threshold: null
  breaks_if:
    - password is phished in a real session
    - online guesses are unlimited
    - protocol parameters are downgraded
  setup:
    - password registration record or augmented PAKE envelope
typical_uses:
  - password login
  - device pairing
  - password-derived channels
does_not_provide:
  - account recovery
  - metadata privacy
  - protection from online guessing without policy
composition_risks:
  - treating password hashing as PAKE
  - missing identity binding
  - weak reset flows
metadata_leaks:
  - account identifier
  - login timing
  - failure behavior
implementation_risk: high
auditability: requires-expert-review
parameter_sensitivity: high
revocation_story: Password reset and account lockout are operational controls outside the PAKE.
operational_failure_modes:
  - downgrade to legacy login
  - leaked registration records
  - poor rate limiting
maturity: deployed
related:
  - key-derivation-functions
  - oblivious-pseudorandom-functions
  - secure-channels
references:
  - rfc9383-opaque
  - rfc9497-voprf
  - rfc9106-argon2
