id: anonymous-credential
name: Anonymous Credential
category: protocol
level: protocol
short_intuition: A holder proves selected attributes or authorization without revealing a stable identity.
security_goals:
  - selective-disclosure
  - issuer-authenticity
  - unlinkability-depending-on-scheme
assumptions:
  - trusted-issuer
  - holder-secret-control
  - privacy-preserving-revocation
requires_trusted_setup: varies
post_quantum: varies
post_quantum_posture: depends
confidence_model:
  type: trusted-issuer
  threshold: not-applicable
  breaks_if:
    - issuer-misissues-credentials
    - holder-secret-is-compromised
    - revocation-checks-track-users
  setup:
    - issuer-public-keys
    - credential-status-infrastructure
typical_uses:
  - private-access-control
  - eligibility-proofs
  - age-or-membership-claims
does_not_provide:
  - network-anonymity
  - coercion-resistance
  - non-transferability-without-extra-design
composition_risks:
  - Rare attributes can identify holders.
  - Issuer-verifier collusion can weaken privacy.
metadata_leaks:
  - verifier-identity
  - presentation-timing
  - revocation-checks
implementation_risk: expert-only
auditability: requires-expert-review
parameter_sensitivity: high
revocation_story: Revocation is necessary but can become a tracking channel if status checks are not privacy-preserving.
operational_failure_modes:
  - attribute-uniqueness
  - verifier-tracking
  - credential-sharing
maturity: emerging
related:
  - anonymous-membership
  - nullifier
  - zero-knowledge-proof
references:
  - camenisch-lysyanskaya-credentials
  - goldwasser-micali-rackoff-zk
