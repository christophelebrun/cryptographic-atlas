id: secret-sharing
name: Secret Sharing
category: threshold
level: basic-primitive
short_intuition: A secret is split into shares so only an authorized subset can reconstruct it.
security_goals:
  - confidentiality-below-threshold
  - availability-at-threshold
assumptions:
  - correct-share-generation
  - independent-share-custody
  - authenticated-reconstruction
requires_trusted_setup: varies
post_quantum: true
post_quantum_posture: plausible
confidence_model:
  type: t-of-n-threshold
  threshold: t-of-n
  breaks_if:
    - threshold-colludes
    - too-many-shares-are-lost
    - shares-are-generated-incorrectly
  setup:
    - dealer-or-distributed-key-generation
typical_uses:
  - backup-and-recovery
  - threshold-decryption
  - distributed-key-custody
does_not_provide:
  - share-authentication
  - malicious-share-detection-without-verification
  - key-rotation
composition_risks:
  - Share custody is an operational security problem.
  - Threshold choices encode governance assumptions.
metadata_leaks:
  - shareholder-identities
  - reconstruction-events
implementation_risk: medium
auditability: requires-operational-audit
parameter_sensitivity: medium
revocation_story: Share replacement, refresh, and rotation must be designed separately from basic sharing.
operational_failure_modes:
  - correlated-share-storage
  - lost-shares
  - unclear-reconstruction-policy
maturity: mature
related:
  - threshold-cryptography
  - secure-aggregation
  - e-voting
references:
  - shamir-secret-sharing
  - boneh-shoup-applied-cryptography
