relationships:
  - source: commitments
    relation: composes-with
    target: zero-knowledge-proof
    notes: ZK proofs often prove statements about committed values without opening them.
  - source: pedersen-commitment
    relation: requires
    target: discrete-logarithm
    notes: Binding depends on the infeasibility of finding the generator relation.
  - source: digital-signature
    relation: inherits-risk-from
    target: discrete-logarithm
    notes: ECDSA, EdDSA, and Schnorr-style signatures inherit discrete-logarithm quantum vulnerability.
  - source: public-key-encryption
    relation: inherits-risk-from
    target: factoring-rsa
    notes: RSA-based encryption inherits factoring and padding assumptions.
  - source: homomorphic-encryption
    relation: inherits-risk-from
    target: lattices
    notes: Many modern FHE families rely on lattice assumptions and parameter selection.
  - source: snarks-starks-bulletproofs
    relation: inherits-risk-from
    target: pairings
    notes: Pairing-based SNARKs inherit pairing and elliptic-curve assumptions.
  - source: range-proofs
    relation: requires
    target: commitments
    notes: Range proofs usually constrain a hidden value inside a commitment or ciphertext.
  - source: nullifier
    relation: implements-pattern
    target: anti-double-use-nullifiers
    notes: Nullifiers are the public duplicate-detection tag used by the pattern.
  - source: anonymous-airdrop
    relation: composes-with
    target: nullifier
    notes: Airdrops use nullifiers to reject duplicate claims.
  - source: private-dao-voting
    relation: composes-with
    target: anonymous-membership
    notes: Voters may prove eligibility without revealing which member they are.
  - source: private-dao-voting
    relation: composes-with
    target: private-aggregation
    notes: The tally should reveal an aggregate rather than individual ballots.
  - source: homomorphic-encryption
    relation: used-in
    target: private-aggregation
    notes: Additive homomorphic encryption is a common private tallying mechanism.
  - source: secure-aggregation
    relation: implements-pattern
    target: private-aggregation
    notes: Secure aggregation is a protocol family for aggregating many client inputs.
  - source: mixnets
    relation: used-in
    target: e-voting
    notes: Mixnets can break the link between submitted encrypted ballots and decrypted ballots.
  - source: make-receipts-useless
    relation: strengthens
    target: e-voting
    notes: Receipt-freeness and coercion resistance are stronger than ballot secrecy.
  - source: snarks-starks-bulletproofs
    relation: inherits-risk-from
    target: trusted-setup
    notes: Some proof systems require setup ceremonies or structured reference strings.
  - source: zero-knowledge-proof
    relation: inherits-risk-from
    target: random-oracle-model
    notes: Fiat-Shamir-style non-interactive proofs often use random-oracle-model reasoning.
  - source: authenticated-encryption
    relation: composes-with
    target: symmetric-encryption
    notes: AEAD schemes combine encryption with integrity and associated-data authentication.
  - source: authenticated-encryption
    relation: composes-with
    target: message-authentication-codes
    notes: AEAD schemes often use MAC-like authentication internally or replace ad hoc encryption-plus-MAC composition.
  - source: oblivious-pseudorandom-functions
    relation: used-in
    target: private-set-intersection
    notes: OPRF-based PSI is a common construction family.
  - source: private-set-intersection
    relation: composes-with
    target: mpc
    notes: PSI can be built from general MPC techniques or specialized protocols depending on the deployment model.
  - source: secure-channels
    relation: composes-with
    target: transcript-binding
    notes: Secure channels bind identities, negotiation, and key exchange into the derived traffic keys.
  - source: secure-channels
    relation: composes-with
    target: authenticated-encryption
    notes: Secure channels usually protect application records with AEAD once handshake keys are derived.
  - source: password-authenticated-key-exchange
    relation: composes-with
    target: secure-channels
    notes: PAKEs can establish or authenticate a session key that is then used by a secure channel.
  - source: oblivious-transfer
    relation: used-in
    target: mpc
    notes: OT is a core building block for many MPC and garbled-circuit protocols.
  - source: private-information-retrieval
    relation: contrasts-with
    target: private-set-intersection
    notes: PIR hides a database index, while PSI reveals an intersection or intersection-derived output.
  - source: polynomial-commitments
    relation: used-in
    target: zk-rollups
    notes: Many rollup proof systems use polynomial commitments to bind witness or trace polynomials.
  - source: vector-commitments
    relation: used-in
    target: privacy-preserving-revocation
    notes: Revocation systems can use vector commitments or authenticated status lists for compact status proofs.
  - source: private-payments
    relation: composes-with
    target: nullifier
    notes: Private payments often use nullifiers or serial numbers to prevent duplicate spending.
  - source: zk-rollups
    relation: composes-with
    target: transcript-binding
    notes: Rollup proofs must bind public inputs, state roots, verifier keys, and batch data to the proof.
  - source: domain-separation
    relation: strengthens
    target: transcript-binding
    notes: Domain separation makes transcript fields and protocol phases unambiguous.
  - source: confidentiality
    relation: commonly-composed-with
    target: integrity
    notes: Most deployed confidentiality mechanisms also need tamper detection.
  - source: confidentiality
    relation: breaks-if
    target: authenticated-encryption
    notes: Confidentiality claims often fail operationally when encryption is used without authentication or plaintext is logged.
  - source: integrity
    relation: commonly-composed-with
    target: authenticity
    notes: Systems usually need both tamper detection and origin binding.
  - source: authenticity
    relation: requires
    target: transcript-binding
    notes: Authenticating incomplete context can bind the right key to the wrong session or statement.
  - source: anonymity
    relation: commonly-composed-with
    target: unlinkability
    notes: Anonymous systems often need unlinkability across repeated actions, but the goals are distinct.
  - source: anonymity
    relation: breaks-if
    target: metadata-leakage
    notes: Timing, network, amount, and rare-attribute metadata can defeat anonymity even when proofs verify.
  - source: unlinkability
    relation: commonly-composed-with
    target: domain-separation
    notes: Context-bound tags prevent linkability across unrelated applications.
  - source: unlinkability
    relation: breaks-if
    target: nullifier
    notes: Nullifiers deliberately create linkability inside a context and must not be reused across contexts.
  - source: forward-secrecy
    relation: requires
    target: key-encapsulation-and-exchange
    notes: Secure channels need fresh key-establishment material to make later long-term key compromise less damaging.
  - source: forward-secrecy
    relation: commonly-composed-with
    target: secure-channels
    notes: Forward secrecy is usually realized at the protocol layer.
  - source: verifiability
    relation: commonly-composed-with
    target: integrity
    notes: A verifier needs tamper-evident inputs and authentic verification parameters.
  - source: verifiability
    relation: breaks-if
    target: transcript-binding
    notes: Verification can be meaningless if public inputs, verifier keys, or context are omitted.
  - source: zcash-orchard
    relation: uses
    target: halo-recursion
    notes: Orchard uses Halo-style proving to avoid the trusted setup model used by earlier Zcash pools.
  - source: zcash-sapling
    relation: uses
    target: private-payments
    notes: Sapling is a concrete shielded-payment protocol suite.
  - source: bbs-verifiable-credentials
    relation: uses
    target: anonymous-credential
    notes: BBS-based credential profiles support selective disclosure and unlinkable derived proofs under pairing assumptions.
  - source: sd-jwt
    relation: contrasts-with
    target: anonymous-credential
    notes: SD-JWT provides selective disclosure, but not anonymous-credential unlinkability by default.
  - source: vc-di-ecdsa
    relation: uses
    target: authenticity
    notes: ECDSA data integrity credentials primarily provide issuer authenticity and integrity, not anonymity.
  - source: vc-di-eddsa
    relation: uses
    target: authenticity
    notes: EdDSA data integrity credentials primarily provide issuer authenticity and integrity, not anonymity.
  - source: lucid-encrypted-mempool
    relation: uses
    target: delayed-reveal
    notes: Encrypted mempools use commit-before-reveal or delayed-decryption sequencing rules.
  - source: ferveo-threshold-mempool
    relation: uses
    target: threshold-cryptography
    notes: Threshold decryption distributes reveal power across a committee.
  - source: encrypted-mempools
    relation: breaks-if
    target: metadata-leakage
    notes: Size, timing, sender path, and censorship behavior can reveal transaction strategy even when payloads are encrypted.
  - source: threshold-bls
    relation: requires
    target: pairings
    notes: Threshold BLS inherits both threshold-share assumptions and pairing-friendly curve assumptions.
  - source: gennaro-dkg
    relation: used-in
    target: threshold-cryptography
    notes: DKG is a setup protocol for dealerless threshold keys.
  - source: poseidon
    relation: used-in
    target: arithmetization
    notes: ZK-friendly hashes are chosen to reduce circuit or constraint cost.
  - source: mimc
    relation: used-in
    target: arithmetization
    notes: MiMC is an example of a low-multiplicative-complexity hash used in some proof circuits.
  - source: rescue-prime
    relation: used-in
    target: arithmetization
    notes: Rescue-Prime is a proof-system-oriented hash family with scheme-specific parameters.
  - source: ckks
    relation: used-in
    target: private-machine-learning-analytics
    notes: Approximate homomorphic arithmetic is common in privacy-preserving analytics and inference discussions.
  - source: bfv
    relation: used-in
    target: private-machine-learning-analytics
    notes: Exact homomorphic arithmetic can support bounded private analytics workloads.
  - source: spdz
    relation: used-in
    target: mpc
    notes: SPDZ is a concrete actively secure arithmetic MPC family.
  - source: mascot
    relation: uses
    target: oblivious-transfer
    notes: MASCOT uses OT-based preprocessing for maliciously secure arithmetic MPC.
  - source: rsa-pkcs1-v1-5-encryption
    relation: breaks-if
    target: public-key-encryption
    notes: Legacy RSA encryption can fail through padding-oracle behavior and should be isolated in migration inventories.
  - source: sha-1
    relation: breaks-if
    target: hash-function
    notes: SHA-1 collision resistance is not adequate for new cryptographic uses.
  - source: md5
    relation: breaks-if
    target: hash-function
    notes: MD5 is retained only for legacy recognition and non-adversarial checksum context.
